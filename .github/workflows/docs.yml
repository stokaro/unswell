name: Docs

# The site is deployed from main and from nowhere else: the Pages environment
# takes no deployment from a tag, so a run for a tag could only fail there. A
# release asks for a run on main instead, through workflow_dispatch from the
# release workflow, and that run builds the folder of the new release from its
# tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # How many released tags keep a folder on the site. Older releases stay in the
  # repository. They stop being built and stop appearing in the picker.
  MAX_DOC_TAG_VERSIONS: ${{ vars.MAX_DOC_TAG_VERSIONS || 10 }}

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
        env:
          GOTOOLCHAIN: local

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      # The rules page comes from a data file. A Go program writes that file by
      # walking the real engine catalog. This step keeps the two in step: a rule
      # added or re-tuned without a fresh file fails here, so the site cannot
      # ship a stale catalog.
      - name: The rules catalog must match the engine
        run: go run ./cmd/docscatalog --output docs/site/src/data/rules-catalog.json --check

      - name: Self-test the site gates
        working-directory: docs/site
        run: npm ci && npm run selftest

      - name: Build and check the current tree
        working-directory: docs/site
        env:
          DOCS_VERSION: edge
        run: npm run build && npm run check:links && npm run check:pages-root && npm run check:repo-links && npm run check:markup

      # The latest release is served at the root of the site. This builds the
      # current tree that way, so the next tag is known to build there.
      - name: Build and check the current tree as a release at the root
        working-directory: docs/site
        env:
          DOCS_VERSION: edge
          DOCS_AT_ROOT: '1'
        run: npm run build && npm run check:links

      # The research report belongs to no version, so the build above does not
      # hold it. The standing build does, with the root of the site as its base.
      - name: Build and check the pages of no version
        working-directory: docs/site
        env:
          DOCS_VERSION: standing
        run: npm run build && npm run check:links && npm run check:repo-links && npm run check:markup

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: each released version is built from its own tag through a
      # linked worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install the site dependencies
        working-directory: docs/site
        run: npm ci

      # One script assembles the whole thing: edge, each released tag, and the
      # root with versions.json, the apex redirect, the CNAME and robots.txt. A
      # maintainer can run the same command and look at the result.
      - name: Assemble the site
        id: assemble
        run: |
          bash scripts/build-docs-site.sh --output "$GITHUB_WORKSPACE/_site" --max-tags "$MAX_DOC_TAG_VERSIONS"
          node -e 'const i=require(process.argv[1]);console.log(`versions=${i.versions.map(v=>v.slug).join(" ")}`)' "$GITHUB_WORKSPACE/_site/versions.json" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # The deploy step lists the artifacts of this run and takes the one it
      # finds. The listing can lag the upload: a deploy that started two seconds
      # after a finished upload found no artifact. A second attempt of this job
      # cannot repair that, because the run then holds two artifacts of one
      # name. So the job waits here until the listing shows exactly one.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=0
          for _ in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count')
            if [ "$count" = "1" ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "this run holds $count Pages artifacts; a repeated attempt cannot deploy, start a new run on main" >&2
              exit 1
            fi
            sleep 2
          done
          echo "the Pages artifact is not listed after 60 seconds" >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # A green deploy means GitHub accepted an artifact. This step says that a
      # reader who types the domain lands on the documentation.
      - name: The published apex must serve the documentation
        working-directory: docs/site
        run: node scripts/check-deployment-candidate.mjs --expected-versions "${{ steps.assemble.outputs.versions }}"
