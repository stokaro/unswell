name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  containers:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-containers.yml
  mirrors:
    needs: containers
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-containers.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  publish:
    needs: [checks, containers, mirrors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Build archives and per-platform SBOMs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease \
            --title "Unswell $RELEASE_TAG" --notes-file CHANGELOG.md
  registry:
    needs: [containers, publish]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
  action-consumer:
    name: Published action (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check this repository through the public action and release archive
        id: unswell
        uses: stokaro/unswell-action@5c4e109d71c1ec16429a62ac1860b97baee3974e
        with:
          version: ${{ github.ref_name }}
          config: .unswell.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: action-consumer-evidence-${{ matrix.os }}
          path: |
            ${{ steps.unswell.outputs.report-json }}
            ${{ steps.unswell.outputs.report-sarif }}
          if-no-files-found: error
