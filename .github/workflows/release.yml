name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the pinned mirror tool before anything is published
        run: bash scripts/mirror-containers.sh --check-tool
  checks:
    uses: ./.github/workflows/ci.yml
  containers:
    needs: [checks, preflight]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-containers.yml
  # The Docker Hub mirror does not gate the release. A credential that the
  # mirror registry rejects fails this job and the run; the archives, the
  # registry entry, and the distribution updates are still published.
  mirrors:
    needs: containers
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-containers.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  publish:
    needs: [checks, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Build archives and per-platform SBOMs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease \
            --title "Unswell $RELEASE_TAG" --notes-file CHANGELOG.md
  registry:
    needs: [containers, publish]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
  # The site builds the folder of a release from its tag, and it is deployed
  # from main. A published release asks for a run of the documentation workflow
  # on main, so the default version of the site moves to this release without
  # waiting for the next change on main.
  site:
    name: Rebuild the site with this release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the documentation workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
  distributions:
    needs: [publish, action-consumer]
    uses: ./.github/workflows/update-distributions.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      PUBLISH_APP_KEY: ${{ secrets.PUBLISH_APP_KEY }}
  action-consumer:
    name: Published action (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check this repository through the public action and release archive
        id: unswell
        uses: stokaro/unswell-action@664a3e95d9d6a65fc1cd84c69cd216649134b608
        with:
          version: ${{ github.ref_name }}
          config: .unswell.yaml
          # The whole repository, as a project of this size would check itself.
          # The CLI stops an analysis after 30 seconds by default, and a hosted
          # runner needs longer for about 1,600 documents, so the job sets the
          # limit and the number of workers.
          paths: .
          timeout: 10m
          jobs: 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: action-consumer-evidence-${{ matrix.os }}
          path: |
            ${{ steps.unswell.outputs.report-json }}
            ${{ steps.unswell.outputs.report-sarif }}
          if-no-files-found: error
