name: Publish containers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      cli: ${{ steps.cli.outputs.digest }}
      mcp: ${{ steps.mcp.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' result.go)
          [[ -n "$version" && "$RELEASE_TAG" == "v$version" ]]
          printf 'value=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Select the hosted runner's Docker daemon
        run: docker context create unswell-release --docker host=unix:///var/run/docker.sock
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          endpoint: unswell-release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the CLI image
        id: cli
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/stokaro/unswell:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_COMMIT=${{ github.sha }}
      - name: Publish the separate MCP image
        id: mcp
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/stokaro/unswell-mcp:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_COMMIT=${{ github.sha }}
      - name: Record immutable image references
        env:
          CLI_DIGEST: ${{ steps.cli.outputs.digest }}
          MCP_DIGEST: ${{ steps.mcp.outputs.digest }}
        run: |
          jq -n --arg cli "ghcr.io/stokaro/unswell@$CLI_DIGEST" \
            --arg mcp "ghcr.io/stokaro/unswell-mcp@$MCP_DIGEST" \
            '{cli: $cli, mcp: $mcp}' >container-images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-container-images
          path: container-images.json
          if-no-files-found: error
  verify:
    name: Verify public images (${{ matrix.arch }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CLI_IMAGE: ghcr.io/stokaro/unswell@${{ needs.publish.outputs.cli }}
      MCP_IMAGE: ghcr.io/stokaro/unswell-mcp@${{ needs.publish.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Select the hosted runner's Docker daemon
        run: docker context create unswell-public --docker host=unix:///var/run/docker.sock
      - name: Pull without registry credentials
        run: |
          docker --context unswell-public pull "$CLI_IMAGE"
          docker --context unswell-public pull "$MCP_IMAGE"
      - name: Check the published images through CLI and MCP
        run: bash scripts/check-containers.sh unswell-public "$CLI_IMAGE" "$MCP_IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-container-evidence-${{ matrix.arch }}
          path: artifacts/containers/
          if-no-files-found: ignore
      - name: Remove pulled images
        if: always()
        run: |
          for image in "$CLI_IMAGE" "$MCP_IMAGE"; do
            if docker --context unswell-public image inspect "$image" >/dev/null 2>&1; then
              docker --context unswell-public image rm "$image"
            fi
          done
