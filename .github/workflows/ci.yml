name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    uses: ./.github/workflows/containers.yml
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test all runtime modules with the minimum compiler
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          bash scripts/modules.sh test
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Install pinned ShellCheck
        run: bash scripts/setup-shellcheck.sh
      - name: Validate MCP Registry metadata with the pinned publisher
        run: |
          bash scripts/setup-mcp-publisher.sh
          make check-registry
      - run: make check
      - run: make race
      - run: make fuzz
      - name: Vulnerability check
        shell: bash
        run: |
          checker=$(cd tools && go tool -n govulncheck)
          while read -r directory role; do
            if [[ "$role" != tools ]]; then
              (cd "$directory" && "$checker" ./...)
            fi
          done <.gomodules
      - name: Coverage evidence
        run: bash scripts/modules.sh test -coverprofile=coverage.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-evidence
          path: |
            **/coverage.out
            artifacts/dogfood/
          if-no-files-found: ignore
