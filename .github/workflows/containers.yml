name: Container checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Containers (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Select the hosted runner's Docker daemon
        run: docker context create unswell-ci --docker host=unix:///var/run/docker.sock
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          endpoint: unswell-ci
      - name: Build the CLI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: unswell-test:cli
          build-args: BUILD_COMMIT=${{ github.sha }}
      - name: Build the separate MCP image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: unswell-test:mcp
          build-args: BUILD_COMMIT=${{ github.sha }}
      - name: Check this repository and rejection probes through both images
        run: bash scripts/check-containers.sh unswell-ci unswell-test:cli unswell-test:mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-evidence-${{ matrix.arch }}
          path: artifacts/containers/
          if-no-files-found: ignore
      - name: Remove test images
        if: always()
        shell: bash
        run: |
          for image in unswell-test:cli unswell-test:mcp; do
            if docker --context unswell-ci image inspect "$image" >/dev/null 2>&1; then
              docker --context unswell-ci image rm "$image"
            fi
          done
