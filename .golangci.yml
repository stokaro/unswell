version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: Use standard testing and quicktest imported as qt.
            - pkg: io/ioutil
              desc: Use io and os.
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 10
    nestif:
      min-complexity: 4
    lll:
      line-length: 140
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/frankban/quicktest
          alias: qt
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: var-naming
        - name: indent-error-flow
        - name: unreachable-code
    gocritic:
      enabled-checks:
        - badLock
        - badRegexp
        - badSorting
        - badSyncOnceFunc
        - deferInLoop
        - emptyDecl
        - filepathJoin

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stokaro/unswell)
