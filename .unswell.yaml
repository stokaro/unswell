version: 1
extends: [builtin:strict-v1]
language: en
files:
  include:
    - "*.md"
    - "docs/**/*.md"
    - "e2e/**/*.md"
    - "**/*.go"
    - "scripts/**/*.sh"
    - "**/*.yaml"
    - "**/*.yml"
  exclude:
    - ".git/**"
    - "vendor/**"
    - "licenses/**"
    - "**/testdata/**"
    - "artifacts/**"
    - "dist/**"
extraction:
  contexts: [comment, string, paragraph, heading, list-item, table-cell]
  exceptions:
    - id: regression-inputs
      paths: ["**/*_test.go"]
      kinds: [string]
      reason: "Test strings contain deliberate violations, malformed inputs, and expected diagnostics."
    - id: phrase-catalog
      paths: ["builtin/phrase.go"]
      kinds: [string]
      symbols: [definitions]
      reason: "The phrase catalog stores the wording that the rules must detect."
    - id: rule-examples
      paths: ["builtin/context.go", "builtin/repetition.go", "builtin/editorial_catalog.go"]
      kinds: [string]
      symbols: [Text]
      reason: "Executable rule examples contain both matching and nonmatching prose."
    - id: editorial-pattern-vocabulary
      paths: ["builtin/editorial_catalog.go"]
      kinds: [string]
      symbols: [Phrases]
      reason: "Configured phrase lists contain the exact wording that the experimental rules must detect."
    - id: shell-gate-fixture
      paths: ["scripts/dogfood.sh", "scripts/check-containers.sh"]
      kinds: [string]
      symbols: [negative_prose]
      reason: "The shell probe supplies a deliberate violation to verify the project policy."
    - id: custom-policy-examples
      paths: ["examples/rules/company.yaml"]
      kinds: [string]
      symbols: [values, fail]
      reason: "The custom policy stores matcher phrases and deliberate failing examples."
    - id: mcp-gate-fixtures
      paths: ["mcp/internal/selfcheck/probes.go"]
      kinds: [string]
      symbols: [probes]
      reason: "The MCP client sends deliberate violations and malformed source to verify server outcomes."
calibration:
  model: none
rules:
  filler.section-announcement: {enabled: true, gate: forbid}
  filler.empty-transition: {enabled: true, gate: forbid}
  hype.vague-praise: {enabled: true, gate: forbid}
  hype.metaphor-cluster: {enabled: true, gate: forbid}
  hype.absolute-claim: {enabled: true, gate: forbid}
  filler.weak-intensifiers: {enabled: true, gate: forbid}
  filler.stacked-hedging: {enabled: true, gate: forbid}
  syntax.paired-contrast-density: {enabled: true, gate: forbid}
  syntax.triad-density: {enabled: true, gate: forbid}
  syntax.whether-preface-density: {enabled: true, gate: forbid}
  syntax.rhetorical-question-density: {enabled: true, gate: forbid}
