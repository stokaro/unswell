version: 1
extends: [builtin:custom]
rules:
  repetition.duplicate-list-item: {enabled: true, gate: forbid}
  repetition.exact-sentence: {enabled: true, gate: forbid}
  repetition.near-sentence: {enabled: true, gate: forbid}
  repetition.sentence-openers: {enabled: true, gate: forbid}
  repetition.paragraph-openers: {enabled: true, gate: forbid}
